    <path d="M125 42v46M102 65h46" stroke="url(#shield)" stroke-width="18" stroke-linecap="round"/>
    <path d="M125 157c-8-17-30-31-49-15-18 15-15 40 2 56l47 43 47-43c17-16 20-41 2-56-19-16-41-2-49 15Z" fill="none" stroke="url(#shield)" stroke-width="13" stroke-linejoin="round"/>
  </g>
  <g transform="translate(300 62)">
