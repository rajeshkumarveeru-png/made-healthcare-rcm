<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">MADE Healthcare</title>
  <desc id="desc">MADE Healthcare shield and heart medical logo</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4f8a"/>
      <stop offset=".48" stop-color="#0b91a7"/>
      <stop offset="1" stop-color="#58d0bf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7b36b"/>
      <stop offset="1" stop-color="#b78342"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123b68"/>
      <stop offset=".58" stop-color="#155f91"/>
