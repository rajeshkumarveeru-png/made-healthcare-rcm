<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">MADE Healthcare</title>
  <desc id="desc">MADE Healthcare shield and heart medical symbol</desc>

  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4f8a"/>
      <stop offset=".48" stop-color="#0b91a7"/>
      <stop offset="1" stop-color="#58d0bf"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7b36b"/>
      <stop offset="1" stop-color="#b78342"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
              dx="0"
              dy="5"
              stdDeviation="5"
              flood-color="#0b3556"
              flood-opacity=".20"
      />
    </filter>
  </defs>

  <!-- MADE Healthcare Symbol -->
  <g transform="translate(0 -8) scale(1.12)" filter="url(#shadow)">

    <!-- Outer Shield -->
    <path
            d="M130 8
         C89 35 52 45 25 49
         V131
         C25 197 63 236 130 270
         C197 236 235 197 235 131
         V49
         C208 45 171 35 130 8Z"
            fill="#ffffff"
            stroke="url(#shield)"
            stroke-width="13"
    />

    <!-- Gold Inner Shield -->
    <path
            d="M130 22
         C96 45 63 54 39 58
         V130
         C39 183 68 216 130 250
         C192 216 221 183 221 130
         V58
         C197 54 164 45 130 22Z"
            fill="none"
            stroke="url(#gold)"
            stroke-width="4"
            opacity=".9"
    />

    <!-- Medical Cross -->
    <path
            d="M130 42 V88
         M107 65 H153"
            fill="none"
            stroke="url(#shield)"
            stroke-width="18"
            stroke-linecap="round"
    />

    <!-- Heart -->
    <path
            d="M130 157
         C122 140 100 126 81 142
         C63 157 66 182 83 198
         L130 241
         L177 198
         C194 182 197 157 179 142
         C160 126 138 140 130 157Z"
            fill="none"
            stroke="url(#shield)"
            stroke-width="13"
            stroke-linejoin="round"
    />

  </g>
</svg>